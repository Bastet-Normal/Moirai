name: Native Safari
on: [pull_request]
permissions:
  contents: read
jobs:
  safari:
    name: Native Safari regression
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SAFARI_BASE_URL: http://127.0.0.1:8769
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the locked Playwright browser engines and OS libraries
        run: sudo safaridriver --enable
      - name: Audit Node dependency severity
        run: npm audit --audit-level=high
      - name: Run native Safari scenarios
        run: npx --no-install playwright test -c native.config.mjs
        env:
          OUTPUT_DIR: ${{ runner.temp }}/novelengine-browser-output

