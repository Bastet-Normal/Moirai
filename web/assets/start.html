<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>打开写作书桌 · Moirai</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: clamp(32px, 12vh, 120px) 20px; background: #f4f2ec; color: #25271e; font: 16px/1.75 -apple-system, "PingFang SC", sans-serif; }
        main { margin: auto; max-width: 35rem; padding: clamp(24px, 6vw, 48px); background: #fffdf8; border: 1px solid #e5dfd2; border-radius: 12px; }
        header { color: #2a5a43; font: 600 19px Georgia, serif; }
        h1 { margin: 24px 0 12px; font: 600 clamp(26px, 5vw, 34px)/1.3 "Songti SC", Georgia, serif; }
        p { margin: 0; }
        code { font-size: .95em; overflow-wrap: anywhere; }
        footer { border-top: 1px solid #e5dfd2; margin-top: 26px; padding-top: 18px; }
        a { color: #2a5a43; text-underline-offset: .23em; display: inline-flex; min-height: 44px; align-items: center; }
        a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <header>Moirai</header>
        <h1>打开本机写作书桌</h1>
        <p>在 Moirai 的 <code>scripts</code> 文件夹里，Mac 双击 <code>launch.command</code>，Windows 双击 <code>launch.bat</code>。启动后，浏览器会自动打开你的作品库。</p>
        <footer>
            <p>书桌已经启动了？</p>
            <a href="http://127.0.0.1:8000/">打开默认地址的书桌</a>
        </footer>
    </main>
</body>
</html>
